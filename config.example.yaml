# 複製為 config.yaml 後修改

# ── 新聞來源（每日抓取）──────────────────────────────
# type: rss（預設）或 html_list（網頁列表頁）
# RSS 來源的名稱會自動採用 feed 自帶標題，name 僅為備用標籤
feeds:
  - name: 疾管署 RSS（一）
    url: "https://www.cdc.gov.tw/RSS/RssXml/Hh094B49-DRwe2RR4eFfrQ?type=1"
  - name: 疾管署 RSS（二）
    url: "https://www.cdc.gov.tw/RSS/RssXml/khD5i5xbqmYc8zCDhJimNg?type=1"
  - name: 國際旅遊疫情
    url: "https://www.cdc.gov.tw/TravelEpidemic/Index/RzNQU2F5L2RhZmRBd2pzWU5tM0NDQT09"
    type: html_list
    category: international   # 週報獨立成「國際重要疫情」段落
  - name: 旅遊疫情速訊
    url: "https://www.cdc.gov.tw/Subscription/exList/5"
    type: html_list
    category: international

# ── NIDSS 監測數據（週報「監測數據」段落，依類別分節）──
# 資料直接解析 NIDSS 頁面內嵌圖表，不經 AI。
# title_contains: 圖表標題關鍵字（空白分隔、須全部命中）
# series_keyword: 只顯示名稱含此關鍵字的 series（過濾排除病例/閾值線）
# summary_url:   疾病頁網址，附上「上週累計/今年累計/去年總數/死亡數」摘要
# chart_type:    line（預設折線）/ bar（堆疊長條）/ share（100% 占比長條）
# sources:       多個表單查詢合併為一張圖（如本土/境外移入各一條線）
chart_weeks: 78            # 趨勢圖時間範圍（週），78 週＝一年半，可比較去年同期

nidss_monitor:
  - section: 呼吸道病原體（整體）
    items:
      - name: 全國每週呼吸道病原體分子生物學檢出
        url: "https://nidss.cdc.gov.tw/Home/Index?op=2"
        title_contains: 呼吸道病原體分子生物學
      - name: LARS 每週重點呼吸道病原體陽性檢體
        url: "https://nidss.cdc.gov.tw/Home/Index?op=2"
        title_contains: 重點呼吸道病原體陽性

  - section: 新冠（COVID-19）
    items:
      - name: 新冠併發重症
        series_keyword: 確定
        sources:
          - label: 本土
            url: "https://nidss.cdc.gov.tw/nndss/Disease?id=19SC"
            form: {pty_immigration_value: "0"}
          - label: 境外移入
            url: "https://nidss.cdc.gov.tw/nndss/Disease?id=19SC"
            form: {pty_immigration_value: "1"}
        summary_url: "https://nidss.cdc.gov.tw/nndss/Disease?id=19SC"
      - name: 每週新冠病毒變異株檢出——本土
        url: "https://nidss.cdc.gov.tw/Home/Index?op=6"
        title_contains: 變異株檢出本土
        chart_type: share
      - name: 每週新冠病毒變異株檢出——境外移入
        url: "https://nidss.cdc.gov.tw/Home/Index?op=6"
        title_contains: 變異株檢出境外移入
        chart_type: share

  - section: 流感
    items:
      - name: 流感併發重症
        series_keyword: 確定
        sources:
          - label: 本土
            url: "https://nidss.cdc.gov.tw/nndss/Disease?id=487a"
            form: {pty_immigration_value: "0"}
          - label: 境外移入
            url: "https://nidss.cdc.gov.tw/nndss/Disease?id=487a"
            form: {pty_immigration_value: "1"}
        summary_url: "https://nidss.cdc.gov.tw/nndss/Disease?id=487a"
      - name: 全國每週流感病毒分子生物學檢出
        url: "https://nidss.cdc.gov.tw/Home/Index?op=2"
        title_contains: 流感病毒分子生物學
        chart_type: share
      - name: LARS 每週流感病毒陽性檢體
        url: "https://nidss.cdc.gov.tw/Home/Index?op=2"
        title_contains: 流感病毒陽性檢體

  - section: 腸病毒
    items:
      - name: 腸病毒感染併發重症
        series_keyword: 確定
        sources:
          - label: 本土
            url: "https://nidss.cdc.gov.tw/nndss/Disease?id=0749"
            form: {pty_immigration_value: "0"}
          - label: 境外移入
            url: "https://nidss.cdc.gov.tw/nndss/Disease?id=0749"
            form: {pty_immigration_value: "1"}
        summary_url: "https://nidss.cdc.gov.tw/nndss/Disease?id=0749"
      - name: 全國每週腸病毒分子生物學檢出
        url: "https://nidss.cdc.gov.tw/Home/Index?op=1"
        title_contains: 腸病毒分子生物學
        chart_type: bar
      - name: 腸病毒健保門急診就診人次
        url: "https://nidss.cdc.gov.tw/Home/Index?op=1"
        title_contains: 腸病毒健保門急診就診人次

  - section: 登革熱
    items:
      # 仿 NIDSS Diagram 頁的長期比較趨勢圖：每個年度一條線、同週對照
      - name: 登革熱確定病例（年度同期比較）
        url: "https://nidss.cdc.gov.tw/nndss/Diagram?id=061"
        chart_type: years
        summary_url: "https://nidss.cdc.gov.tw/nndss/Disease?id=061"

# ── 週報「本週公告摘要」的疾病分組排序白名單 ────────────
watch_diseases:
  - 登革熱
  - 流感
  - 腸病毒
  - COVID-19

# ── 一般設定 ─────────────────────────────────────────
max_items_per_run: 30      # 每次抓取最多處理幾則新聞
data_dir: data
reports_dir: reports

# Claude 模型設定
model: claude-opus-5
max_tokens: 16000
