# 複製為 config.yaml 後修改
#
# ⚠️ 標註「需確認」的網址是佔位值：
#   - RSS feed 網址請到 https://www.cdc.gov.tw/RSS 確認
#   - 開放資料集網址請到 https://data.cdc.gov.tw/ 搜尋各資料集後，
#     複製其 CSV/JSON 下載連結（通常在 od.cdc.gov.tw 網域）

# ── 新聞來源（每日抓取）──────────────────────────────
# type: rss（預設）或 html_list（網頁列表頁）
# RSS 來源的名稱會自動採用 feed 自帶標題，name 僅為備用標籤
feeds:
  - name: 疾管署 RSS（一）
    url: "https://www.cdc.gov.tw/RSS/RssXml/Hh094B49-DRwe2RR4eFfrQ?type=1"
  - name: 疾管署 RSS（二）
    url: "https://www.cdc.gov.tw/RSS/RssXml/khD5i5xbqmYc8zCDhJimNg?type=1"
  - name: 國際旅遊疫情
    url: "https://www.cdc.gov.tw/TravelEpidemic/Index/RzNQU2F5L2RhZmRBd2pzWU5tM0NDQT09"
    type: html_list

# ── 關注疾病（週報統計區與重點速覽的白名單）────────────
watch_diseases:
  - 登革熱
  - 流感
  - 腸病毒
  - COVID-19

# ── 開放資料統計來源（週報產生時抓取）──────────────────
# 疾病代碼取自 NIDSS 查詢頁（nidss.cdc.gov.tw/nndss/Disease?id=代碼）：
#   061=登革熱, 487a=流感併發重症, 19SC=COVID-19, 0749=腸病毒感染併發重症
# 資料集網址依疾管署開放資料常見命名推定，執行 `python -m cdc_news.main verify`
# 可一次驗證所有網址與欄位名是否正確。
#
# 欄位配置（三選一）：
#   year_field + week_field       每列帶年份與週別欄位（法定傳染病週報表常見格式）
#   mode: line_list + date_field  每列一筆病例（完整日期）
#   mode: weekly_count + date_field + count_field  每列已是週統計值
stats_datasets:
  - disease: 登革熱
    url: "https://od.cdc.gov.tw/eic/Weekly_Age_County_Gender_061.json"   # 待 verify
    year_field: 發病年份
    week_field: 發病週別
    count_field: 確定病例數
  - disease: 流感（併發重症）
    url: "https://od.cdc.gov.tw/eic/Weekly_Age_County_Gender_487a.json"  # 待 verify
    year_field: 發病年份
    week_field: 發病週別
    count_field: 確定病例數
  - disease: COVID-19
    url: "https://od.cdc.gov.tw/eic/Weekly_Age_County_Gender_19SC.json"  # 待 verify
    year_field: 發病年份
    week_field: 發病週別
    count_field: 確定病例數
  - disease: 腸病毒（併發重症）
    url: "https://od.cdc.gov.tw/eic/Weekly_Age_County_Gender_0749.json"  # 待 verify
    year_field: 發病年份
    week_field: 發病週別
    count_field: 確定病例數

# ── 實驗室監測資料來源（週報「實驗室監測」段落）────────
# url 請填 NIDSS 圖表右上角「原始資料下載」按鈕的連結
# （流感專區 nidss.cdc.gov.tw/Home/Index?op=2、新冠專區 op=6，
#   在按鈕上按右鍵→複製連結，貼到下方後執行 verify 檢查欄位名）
# group_field: 分組欄位（病原體/型別/病毒株等），週報會列出各分組明細
lab_datasets:
  - name: 每周呼吸道病原體檢出
    url: ""                     # ← 待填（op=2 頁面）
    year_field: 年
    week_field: 週
    group_field: 病原體
    count_field: 檢出數
  - name: 流感病毒分子生物學檢出
    url: ""                     # ← 待填（op=2 頁面）
    year_field: 年
    week_field: 週
    group_field: 型別
    count_field: 檢出數
  - name: LARS 重點呼吸道病原體陽性
    url: ""                     # ← 待填（op=2 頁面）
    year_field: 年
    week_field: 週
    group_field: 病原體
    count_field: 陽性數
  - name: LARS 每周流感病原體陽性數
    url: ""                     # ← 待填（op=2 頁面）
    year_field: 年
    week_field: 週
    group_field: 病原體
    count_field: 陽性數
  - name: 新冠病毒變異株本土病例檢出
    url: ""                     # ← 待填（op=6 頁面）
    year_field: 年
    week_field: 週
    group_field: 變異株
    count_field: 檢出數
  - name: 新冠病毒變異株境外移入病例檢出
    url: ""                     # ← 待填（op=6 頁面）
    year_field: 年
    week_field: 週
    group_field: 變異株
    count_field: 檢出數

# ── 一般設定 ─────────────────────────────────────────
max_items_per_run: 30      # 每次抓取最多處理幾則新聞
data_dir: data
reports_dir: reports

# Claude 模型設定
model: claude-opus-5
max_tokens: 16000
