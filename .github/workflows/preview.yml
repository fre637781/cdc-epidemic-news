# 手動觸發：產生「監測數據」段落與趨勢圖預覽並 commit（不呼叫 Claude API）
name: Preview monitor charts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare config
        run: |
          if [ ! -f config.yaml ]; then cp config.example.yaml config.yaml; fi

      - name: Build preview
        env:
          PYTHONPATH: src
        run: python -m cdc_news.main preview

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/preview.md reports/assets/preview
          git diff --cached --quiet || git commit -m "chore: monitor charts preview"
          git push
