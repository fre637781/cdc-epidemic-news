# 每日抓取疾管署新聞存檔（不呼叫 Claude API，零成本）
name: Daily fetch

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 台北時間 08:00，每天
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare config
        run: |
          if [ ! -f config.yaml ]; then cp config.example.yaml config.yaml; fi

      - name: Fetch news
        env:
          PYTHONPATH: src
        run: python -m cdc_news.main fetch

      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: fetch news $(date -u +%F)"
          git push
