# 每週一產生上一週的疫情週報（AI 摘要 + 開放資料統計）
name: Weekly report

on:
  schedule:
    - cron: "30 0 * * 1"  # UTC 00:30 = 台北時間 08:30，每週一（避開每日抓取時段）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      MAIL_ENABLED: ${{ secrets.MAIL_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare config
        run: |
          if [ ! -f config.yaml ]; then cp config.example.yaml config.yaml; fi

      - name: Fetch latest news and build weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONPATH: src
        run: python -m cdc_news.main run

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "chore: weekly CDC report $(date -u +%F)"
          git push

      # ── Email 寄送（需設定 MAIL_USERNAME / MAIL_PASSWORD secrets）──
      - name: Prepare email body
        id: report
        run: |
          FILE=$(ls -t reports/2*-W*.md | head -1)
          WEEK=$(basename "$FILE" .md)
          {
            echo "> 圖表完整版請開：https://github.com/${{ github.repository }}/blob/main/$FILE"
            echo
            cat "$FILE"
          } > email-body.md
          echo "file=$FILE"  >> "$GITHUB_OUTPUT"
          echo "week=$WEEK"  >> "$GITHUB_OUTPUT"

      - name: Send email
        if: env.MAIL_ENABLED == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "疫情週報 ${{ steps.report.outputs.week }}"
          to: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
          from: CDC 疫情週報 <${{ secrets.MAIL_USERNAME }}>
          html_body: file://email-body.md
          convert_markdown: true
          attachments: reports/assets/${{ steps.report.outputs.week }}/*.png
