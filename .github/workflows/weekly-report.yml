# 每週一產生上一週的疫情週報（AI 摘要 + 開放資料統計）
name: Weekly report

on:
  schedule:
    - cron: "30 0 * * 1"  # UTC 00:30 = 台北時間 08:30，每週一（避開每日抓取時段）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare config
        run: |
          if [ ! -f config.yaml ]; then cp config.example.yaml config.yaml; fi

      - name: Fetch latest news and build weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONPATH: src
        run: python -m cdc_news.main run

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "chore: weekly CDC report $(date -u +%F)"
          git push
